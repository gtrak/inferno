[package]
name = "inferno-server"
version = "0.1.0"
edition = "2024"
publish = false

# The HTTP layer lives in the library so integration tests can start the whole
# server in-process; `src/main.rs` only parses the command line and runs it.
[lib]
name = "inferno_server"
path = "src/lib.rs"

[[bin]]
name = "inferno-server"
path = "src/main.rs"

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.9"
clap = { version = "=4.6.9", features = ["derive"] }
figment = { version = "=0.10.19", features = ["env", "toml"] }
futures = "=0.3.34"
minijinja = { version = "=2.24.0", features = ["json"] }
prometheus-client = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokenizers = { version = "=0.22.1", default-features = false, features = [
    "onig",
] }
tokio = { version = "=1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
] }
