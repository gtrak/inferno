[package]
name = "inferno-server"
version = "0.1.0"
edition = "2024"
publish = false

# The HTTP layer lives in the library so integration tests can start the whole
# server in-process; `src/main.rs` only parses the command line and runs it.
# This crate is transport only: everything it integrates lives in `inferno-host`.
[lib]
name = "inferno_server"
path = "src/lib.rs"

[[bin]]
name = "inferno-server"
path = "src/main.rs"

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.9"
clap = { version = "=4.6.9", features = ["derive"] }
futures = "=0.3.34"
inferno-host = { path = "../host" }
prometheus-client = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "=0.1.44"

[dev-dependencies]
# `tests/queue_time.rs` installs its own subscriber layer to read the queue-depth
# field back out of the traces the admission path emits.
tracing-subscriber = { version = "=0.3.23", features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
] }
