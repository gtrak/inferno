[package]
name = "inferno-host"
version = "0.1.0"
edition = "2024"
publish = false

# The integration and ownership layer: admission, the engine boundary, the
# tokenizer and chat template, stop strings, configuration, logging and metrics.
# Transport lives in `inferno-server`, so this crate must never depend on axum.
# It is also the crate that links the Zig core (`build.rs`).
[lib]
name = "inferno_host"
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.6.9", features = ["derive"] }
figment = { version = "=0.10.19", features = ["env", "toml"] }
minijinja = { version = "=2.24.0", features = ["json"] }
prometheus-client = "=0.26.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokenizers = { version = "=0.22.1", default-features = false, features = [
    "onig",
] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
] }
