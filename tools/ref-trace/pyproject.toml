[project]
name = "ref-trace"
version = "0.1.0"
description = "HF reference traces and tiny random-weight Qwen4Exp checkpoints (inferno oracle)"
requires-python = ">=3.13"
dependencies = [
    "torch",
    # The reference implementation of Qwen4Exp only exists on transformers main.
    "transformers @ git+https://github.com/huggingface/transformers",
    "safetensors",
    "numpy",
]

[project.optional-dependencies]
# `reference_trace.py --device-map auto` (a checkpoint too big for one device). Not a default
# dependency: run.sh, the tiny fixture and `io-probe` never need it, and keeping the bootstrap
# CPU-only and small is what lets the fixtures regenerate on a box with no CUDA toolkit.
real = ["accelerate"]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
